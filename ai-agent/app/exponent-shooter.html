<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>指数法則クイズ</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;background:#08081a;font-family:'Noto Sans JP',sans-serif;color:#e2e8f0}
  body{display:flex;justify-content:center;align-items:center;min-height:100vh}
  #loginOverlay{
    position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(circle at 50% 30%,#1b1740,#08081a 70%);z-index:10;
  }
  #loginCard{
    background:rgba(255,255,255,0.06);border:1px solid rgba(167,139,250,0.35);
    border-radius:20px;padding:36px 40px;text-align:center;width:min(90vw,420px);
    box-shadow:0 20px 60px rgba(0,0,0,0.5);
  }
  #loginCard h1{color:#c4b5fd;font-size:22px;font-weight:800;margin-bottom:6px}
  #loginCard p{color:#94a3b8;font-size:13px;margin-bottom:22px;line-height:1.7}
  #loginCard select{
    width:100%;padding:12px;border-radius:10px;border:1px solid rgba(167,139,250,0.5);
    background:#12102b;color:#e2e8f0;font-size:16px;font-weight:700;margin-bottom:18px;
  }
  #loginCard button{
    width:100%;padding:13px;border:none;border-radius:10px;
    background:linear-gradient(135deg,#7c3aed,#4f46e5);color:#fff;font-weight:800;font-size:16px;
    cursor:pointer;transition:transform .15s;
  }
  #loginCard button:hover{transform:translateY(-2px)}
  #loginCard button:disabled{opacity:.4;cursor:not-allowed;transform:none}

  #app{width:100%;max-width:700px;padding:24px 20px;margin:0 auto}
  #hud{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-weight:700}
  #hud .user{color:#c4b5fd;font-size:15px}
  #hud .score{color:#e2e8f0;font-size:15px}

  #progressDots{display:flex;justify-content:center;gap:6px;margin-bottom:6px}
  .dot{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,0.15)}
  .dot.cur{width:13px;height:13px;outline:2px solid #e2e8f0;outline-offset:1px}

  #stageLabel{text-align:center;color:rgba(196,181,253,0.8);font-size:13px;margin-bottom:18px}

  #questionBox{
    background:rgba(255,255,255,0.055);border:1px solid rgba(167,139,250,0.3);
    border-radius:16px;padding:28px 20px;text-align:center;margin-bottom:22px;
  }
  #questionBox .qtext{font-size:26px;font-weight:800;color:#f1ecff;line-height:1.5;word-break:break-word}

  #choicesGrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px}
  @media (max-width:480px){ #choicesGrid{grid-template-columns:1fr} }
  .choiceBtn{
    background:rgba(88,28,135,0.5);border:2px solid #a78bfa;border-radius:12px;
    color:#fff;font-size:19px;font-weight:700;padding:16px 10px;cursor:pointer;
    transition:transform .12s, background .2s, border-color .2s;
  }
  .choiceBtn:hover:not(:disabled){transform:translateY(-2px);background:rgba(124,58,237,0.55)}
  .choiceBtn:disabled{cursor:default}
  .choiceBtn.correct{background:rgba(4,120,87,0.85);border-color:#34d399;box-shadow:0 0 18px rgba(52,211,153,0.5)}
  .choiceBtn.wrong{background:rgba(153,27,27,0.85);border-color:#ef4444}
  .choiceBtn.dim{opacity:0.45}

  #feedbackBox{text-align:center;font-size:22px;font-weight:800;margin-bottom:14px}
  #feedbackBox.correct{color:#6ee7b7}
  #feedbackBox.wrong{color:#fca5a5}

  #explainBox{
    display:none;background:rgba(251,191,36,0.08);border:1px solid rgba(251,191,36,0.4);
    border-radius:14px;padding:16px 18px;margin-bottom:20px;white-space:pre-line;
    font-size:15px;line-height:1.9;color:#fde68a;
  }
  #explainBox .label{font-weight:800;color:#fbbf24;margin-bottom:6px;display:block}

  #nextBtn{
    display:none;width:100%;padding:15px;border:none;border-radius:12px;
    background:linear-gradient(135deg,#7c3aed,#4f46e5);color:#fff;font-weight:800;font-size:17px;
    cursor:pointer;transition:transform .15s;
  }
  #nextBtn:hover{transform:translateY(-2px)}

  #resultsScreen{display:none;width:100%;max-width:640px;padding:30px 24px;text-align:center}
  #resultsScreen h2{font-size:28px;font-weight:800;margin-bottom:14px}
  #resultsScreen h2.pass{color:#6ee7b7}
  #resultsScreen h2.fail{color:#c4b5fd}
  #resultsScreen .scoreLine{font-size:20px;font-weight:800;color:#e2e8f0;margin-bottom:6px}
  #resultsScreen .passLine{font-weight:700;margin-bottom:18px}
  #resultsScreen .passLine.pass{color:#6ee7b7}
  #resultsScreen .passLine.fail{color:#fbbf24}
  #resultsScreen .bodyMsg{color:#cbd5e1;font-size:15px;margin-bottom:26px;line-height:1.8}
  #stageTable{width:100%;border-collapse:collapse;margin-bottom:30px}
  #stageTable td{padding:8px 6px;font-size:14px;border-bottom:1px solid rgba(255,255,255,0.08)}
  #stageTable td.name{text-align:left;color:#a78bfa}
  #stageTable td.val{text-align:right;font-weight:800}
  #retryBtn{
    width:100%;padding:15px;border:none;border-radius:12px;margin-bottom:14px;
    background:linear-gradient(135deg,#7c3aed,#4f46e5);color:#fff;font-weight:800;font-size:17px;cursor:pointer;
  }
  #retryBtn:hover{transform:translateY(-2px)}
  #changeUserLink{color:#94a3b8;font-size:13px;text-decoration:underline;cursor:pointer;background:none;border:none}
</style>
</head>
<body>

<div id="loginOverlay">
  <div id="loginCard">
    <h1>指数法則クイズ</h1>
    <p>あなたのユーザー番号を選んでください。<br>成績は自動的に記録されます。</p>
    <select id="userSelect">
      <option value="">-- 選択してください --</option>
    </select>
    <button id="startBtn" disabled>ゲームをはじめる</button>
  </div>
</div>

<div id="app" hidden>
  <div id="hud">
    <span class="user" id="userLabel"></span>
    <span class="score" id="scoreLabel"></span>
  </div>
  <div id="progressDots"></div>
  <div id="stageLabel"></div>
  <div id="questionBox"><div class="qtext" id="qtext"></div></div>
  <div id="choicesGrid"></div>
  <div id="feedbackBox"></div>
  <div id="explainBox"><span class="label">📘 解説</span><span id="explainText"></span></div>
  <button id="nextBtn">次の問題 →</button>
</div>

<div id="resultsScreen">
  <h2 id="resultsTitle"></h2>
  <div class="scoreLine" id="resultsScoreLine"></div>
  <div class="passLine" id="resultsPassLine"></div>
  <div class="bodyMsg" id="resultsBody"></div>
  <table id="stageTable"></table>
  <button id="retryBtn">同じユーザーでもう一度挑戦する</button>
  <button id="changeUserLink">ユーザーを変更する</button>
</div>

<script>
// ══════════════════════════════════════════════
//  汎用ヘルパー
// ══════════════════════════════════════════════
function shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
function randInt(min,max){ return min+Math.floor(Math.random()*(max-min+1)); }
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

// ══════════════════════════════════════════════
//  数式表示ヘルパー（指数を上付き文字で表現）
// ══════════════════════════════════════════════
const SUP={'0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹','-':'⁻'};
function sup(n){ return String(n).split('').map(c=>SUP[c]!==undefined?SUP[c]:c).join(''); }
function powStr(base,exp){ return exp===1 ? String(base) : base+sup(exp); }
const ROOT_MARK={2:'√',3:'∛',4:'⁴√',5:'⁵√',6:'⁶√',7:'⁷√',8:'⁸√'};

// base^exp を「a^(exp) [= 1/a^|exp|]」の途中式文字列で返す（解説用）
function fracStep(base,exp){
  if(exp>=0) return powStr(base,exp);
  return powStr(base,exp)+' = 1/'+powStr(base,-exp);
}

// 既約分数
function gcd(a,b){ a=Math.abs(a); b=Math.abs(b); return b? gcd(b,a%b) : a; }
function reduceFrac(n,d){
  if(d<0){ n=-n; d=-d; }
  const g=gcd(n,d)||1;
  return [n/g, d/g];
}
function formatFrac(n,d){
  const [rn,rd]=reduceFrac(n,d);
  if(rd===1) return String(rn);
  return rn+'/'+rd;
}
function powFrac(base,exp){
  if(exp>=0) return [Math.pow(base,exp),1];
  return [1,Math.pow(base,-exp)];
}
function fracToStr(f){ return f[1]===1? String(f[0]) : f[0]+'/'+f[1]; }

// ══════════════════════════════════════════════
//  選択肢生成の共通ヘルパー
// ══════════════════════════════════════════════
function buildChoices(correct, candidates){
  const set=[String(correct)];
  for(const c of candidates){
    const s=String(c);
    if(!set.includes(s)) set.push(s);
    if(set.length>=5) break;
  }
  let guard=1;
  while(set.length<5 && guard<60){
    const cs=String(correct);
    const m=cs.match(/^(-?\d+)\/(\d+)$/);
    let s;
    if(m){
      const n=parseInt(m[1]),d=parseInt(m[2]);
      const variants=[formatFrac(n+guard,d),formatFrac(n,d+guard),formatFrac(n*2,d),formatFrac(d,n)];
      s=variants[guard%variants.length];
    } else if(/^-?\d+(\.\d+)?$/.test(cs)){
      const n=parseFloat(cs);
      const variants=[String(n+guard),String(Math.max(1,n-guard)),String(n*2),formatFrac(1,Math.max(1,Math.round(n)))];
      s=variants[guard%variants.length];
    } else {
      s=cs+'′'.repeat(guard);
    }
    if(s!==cs && !set.includes(s)) set.push(s);
    guard++;
  }
  return shuffle(set);
}

// ══════════════════════════════════════════════
//  ステージ1：数値の指数計算（基本・正の指数のみ）
// ══════════════════════════════════════════════
const BASES1=[2,3,4,5,6,7,9];
// 6・7・9のような大きい底は3乗までに抑え、それ以外も少し優しい範囲にする
function expCapFor(base){ return base>=6 ? 3 : 4; }

function genStage1(){
  const base=pick(BASES1);
  const cap=expCapFor(base);
  const kind=pick(['mul','div','pow','triple']);
  let text, netExp, explain;
  if(kind==='mul'){
    const m=randInt(1,cap), n=randInt(1,cap);
    text=powStr(base,m)+'×'+powStr(base,n);
    netExp=m+n;
    explain='指数法則：aᵐ×aⁿ = aᵐ⁺ⁿ\n'+text+' = '+base+'^('+m+'+'+n+') = '+fracStep(base,netExp);
  } else if(kind==='div'){
    const n=randInt(1,cap-1), m=randInt(n+1,cap);
    text=powStr(base,m)+'÷'+powStr(base,n);
    netExp=m-n;
    explain='指数法則：aᵐ÷aⁿ = aᵐ⁻ⁿ\n'+text+' = '+base+'^('+m+'-'+n+') = '+fracStep(base,netExp);
  } else if(kind==='pow'){
    const m=randInt(1,Math.max(1,cap-1)), n=randInt(2,cap);
    text='('+powStr(base,m)+')'+sup(n);
    netExp=m*n;
    explain='指数法則：(aᵐ)ⁿ = aᵐˣⁿ\n'+text+' = '+base+'^('+m+'×'+n+') = '+fracStep(base,netExp);
  } else {
    const m=randInt(1,cap), n=randInt(1,cap), p=randInt(1,cap);
    text=powStr(base,m)+'×'+powStr(base,n)+'÷'+powStr(base,p);
    netExp=m+n-p;
    explain='指数法則：aᵐ×aⁿ÷aᵖ = aᵐ⁺ⁿ⁻ᵖ\n'+text+' = '+base+'^('+m+'+'+n+'-'+p+') = '+fracStep(base,netExp);
  }
  if(Math.pow(base,Math.abs(netExp))>50000) return genStage1();

  const correct=fracToStr(powFrac(base,netExp));
  explain+=' = '+correct;
  const wrongExps=shuffle([netExp+1,netExp-1,netExp+2,-netExp,netExp*2].filter(e=>e!==netExp));
  const candidates=wrongExps.map(e=>fracToStr(powFrac(base,e)));
  return {
    stageLabel:'ステージ1：指数の基本計算',
    text:text+' = ?',
    correct, explain,
    choices:buildChoices(correct,candidates)
  };
}

// ══════════════════════════════════════════════
//  ステージ2：負の指数・0乗を含む数値計算
// ══════════════════════════════════════════════
function genStage2(){
  const base=pick(BASES1);
  const cap=expCapFor(base);
  const kind=pick(['neg1','zero','mulneg','nestneg','triple']);
  let text, netExp, explain;
  if(kind==='neg1'){
    const n=randInt(1,cap);
    text=powStr(base,-n);
    netExp=-n;
    explain='指数法則：a⁻ⁿ = 1/aⁿ\n'+text+' = 1/'+powStr(base,n);
  } else if(kind==='zero'){
    text=powStr(base,0);
    netExp=0;
    explain='指数法則：a⁰ = 1 （a≠0）\n'+text+' = 1';
  } else if(kind==='mulneg'){
    const m=randInt(-cap,-1), n=randInt(1,cap);
    text=powStr(base,m)+'×'+powStr(base,n);
    netExp=m+n;
    explain='指数法則：aᵐ×aⁿ = aᵐ⁺ⁿ\n'+text+' = '+base+'^('+m+'+'+n+') = '+fracStep(base,netExp);
  } else if(kind==='nestneg'){
    const m=randInt(-2,-1), n=randInt(-2,-1);
    text='('+powStr(base,m)+')'+sup(n);
    netExp=m*n;
    explain='指数法則：(aᵐ)ⁿ = aᵐˣⁿ\n'+text+' = '+base+'^('+m+'×('+n+')) = '+fracStep(base,netExp);
  } else {
    const m=randInt(-cap,-1), n=randInt(1,cap), p=randInt(1,cap);
    text=powStr(base,m)+'×'+powStr(base,n)+'÷'+powStr(base,p);
    netExp=m+n-p;
    explain='指数法則：aᵐ×aⁿ÷aᵖ = aᵐ⁺ⁿ⁻ᵖ\n'+text+' = '+base+'^('+m+'+'+n+'-'+p+') = '+fracStep(base,netExp);
  }
  if(Math.pow(base,Math.abs(netExp))>50000) return genStage2();

  const correctFrac=powFrac(base,netExp);
  const correct=fracToStr(correctFrac);
  explain+=' = '+correct;
  const wrongExps=shuffle([netExp+1,netExp-1,-netExp,netExp+2,netExp-2].filter(e=>e!==netExp));
  const candidates=wrongExps.map(e=>fracToStr(powFrac(base,e)));
  candidates.push(fracToStr([correctFrac[1],correctFrac[0]]));
  return {
    stageLabel:'ステージ2：負の指数・0乗の計算',
    text:text+' = ?',
    correct, explain,
    choices:buildChoices(correct,candidates)
  };
}

// ══════════════════════════════════════════════
//  ステージ3：累乗根の計算
// ══════════════════════════════════════════════
const CLEAN_ROOTS=[
  {value:1,n:6,root:1},{value:16,n:4,root:2},{value:243,n:5,root:3},{value:64,n:6,root:2},
  {value:81,n:4,root:3},{value:32,n:5,root:2},{value:729,n:6,root:3},{value:128,n:7,root:2},
  {value:625,n:4,root:5},{value:216,n:3,root:6},{value:1024,n:5,root:4},{value:256,n:8,root:2}
];

const CLEAN_FRAC_ROOTS=[ // [分子,分母,n,結果分子,結果分母]
  [1,125,3,1,5],[1,64,6,1,2],[16,81,4,2,3],[1,32,5,1,2],[1,27,3,1,3],[1,16,4,1,2]
];

// 「積・商が n 乗の形にまとまる」複合ルート問題（検証済み・解説付き）
const COMPOSITE_ROOTS=[
  {text:'⁴√5 × ⁴√125',correct:'5',explain:'指数法則：ⁿ√a×ⁿ√b = ⁿ√(ab)\n⁴√5×⁴√125 = ⁴√(5×125) = ⁴√625 = ⁴√5⁴ = 5'},
  {text:'³√250 ÷ ³√2',correct:'5',explain:'指数法則：ⁿ√a÷ⁿ√b = ⁿ√(a÷b)\n³√250÷³√2 = ³√(250÷2) = ³√125 = ³√5³ = 5'},
  {text:'(⁸√9)⁴',correct:'3',explain:'指数法則：(ⁿ√a)ᵐ = a^(m/n)\n(⁸√9)⁴ = 9^(4/8) = 9^(1/2) = √9 = 3'},
  {text:'⁴√√256',correct:'2',explain:'内側から順に計算する\n√256 = 16 → ⁴√16 = ⁴√2⁴ = 2'},
  {text:'⁴√4 × ⁴√64',correct:'4',explain:'指数法則：ⁿ√a×ⁿ√b = ⁿ√(ab)\n⁴√4×⁴√64 = ⁴√(4×64) = ⁴√256 = ⁴√4⁴ = 4'},
  {text:'³√2 × ³√20',correct:'2∛5',explain:'指数法則：ⁿ√a×ⁿ√b = ⁿ√(ab)\n³√2×³√20 = ³√40 = ³√(8×5) = ³√8×³√5 = 2∛5'},
  {text:'³√81 ÷ ³√3',correct:'3',explain:'指数法則：ⁿ√a÷ⁿ√b = ⁿ√(a÷b)\n³√81÷³√3 = ³√(81÷3) = ³√27 = ³√3³ = 3'},
  {text:'³√10 ÷ ³√640',correct:'1/4',explain:'指数法則：ⁿ√a÷ⁿ√b = ⁿ√(a÷b)\n³√10÷³√640 = ³√(10÷640) = ³√(1/64) = 1/4'},
  {text:'(⁶√4)³',correct:'2',explain:'指数法則：(ⁿ√a)ᵐ = a^(m/n)\n(⁶√4)³ = 4^(3/6) = 4^(1/2) = √4 = 2'},
  {text:'³√√(3⁶)',correct:'3',explain:'内側から順に計算する\n√(3⁶) = 3³ = 27 → ³√27 = ³√3³ = 3'},
];
const usedComposite=new Set();

function genStage3(){
  const kind=pick(['clean','fraction','composite']);
  if(kind==='composite'){
    if(usedComposite.size>=COMPOSITE_ROOTS.length) usedComposite.clear();
    let item, tries=0;
    do{ item=pick(COMPOSITE_ROOTS); tries++; } while(usedComposite.has(item.text)&&tries<30);
    usedComposite.add(item.text);
    const cn=parseFloat(item.correct)||1;
    const candidates=[String(cn+1),String(Math.max(1,cn-1)),String(cn*2),
      item.correct.includes('∛')? item.correct.replace('2∛5','∛5') : String(cn+2)];
    return {
      stageLabel:'ステージ3：累乗根の計算',
      text:item.text+' = ?',
      correct:item.correct, explain:item.explain,
      choices:buildChoices(item.correct,candidates)
    };
  } else if(kind==='fraction'){
    const [n,d,idx,rn,rd]=pick(CLEAN_FRAC_ROOTS);
    const text=ROOT_MARK[idx]+'('+n+'/'+d+')';
    const correct=formatFrac(rn,rd);
    const candidates=[formatFrac(rn+1,rd),formatFrac(rd,rn),formatFrac(rn,rd+1),formatFrac(rn+1,rd+1)];
    const explain='指数法則：ⁿ√(a/b) = ⁿ√a ÷ ⁿ√b\n'+ROOT_MARK[idx]+n+' = '+rn+'，'+ROOT_MARK[idx]+d+' = '+rd+'\nよって '+text+' = '+correct;
    return {
      stageLabel:'ステージ3：累乗根の計算',
      text:text+' = ?',
      correct, explain,
      choices:buildChoices(correct,candidates)
    };
  } else {
    const item=pick(CLEAN_ROOTS);
    const text=ROOT_MARK[item.n]+item.value;
    const correct=String(item.root);
    const candidates=[String(item.root+1),String(Math.max(1,item.root-1)),String(item.root+2),String(item.root*2)];
    const explain='指数法則：ⁿ√(kⁿ) = k\n'+text+' = '+ROOT_MARK[item.n]+'('+item.root+sup(item.n)+') = '+correct;
    return {
      stageLabel:'ステージ3：累乗根の計算',
      text:text+' = ?',
      correct, explain,
      choices:buildChoices(correct,candidates)
    };
  }
}

// ══════════════════════════════════════════════
//  ステージ4：有理数指数
// ══════════════════════════════════════════════
const COMBO_RATIONAL=[
  {text:'3^(1/2) × 3^(3/2)',correct:'9',wrong:['3','27','1/3'],
   explain:'指数法則：aᵖ×aᑫ = aᵖ⁺ᑫ\n3^(1/2)×3^(3/2) = 3^(1/2+3/2) = 3^2 = 9'},
  {text:'9^(3/4) ÷ 9^(-1/4)',correct:'9',wrong:['3','81','1/9'],
   explain:'指数法則：aᵖ÷aᑫ = aᵖ⁻ᑫ\n9^(3/4)÷9^(-1/4) = 9^(3/4-(-1/4)) = 9^1 = 9'},
  {text:'³√2 × ⁶√2 ÷ √(2³)',correct:'1/2',wrong:['2','4','1/4'],
   explain:'すべて2の指数に直して計算する\n2^(1/3)×2^(1/6)÷2^(3/2) = 2^(1/3+1/6-3/2) = 2^(-1) = 1/2'},
  {text:'⁴√3³ × √3³ ÷ ⁴√3',correct:'9',wrong:['3','27','1/9'],
   explain:'すべて3の指数に直して計算する\n3^(3/4)×3^(3/2)÷3^(1/4) = 3^(3/4+3/2-1/4) = 3^2 = 9'},
  {text:'2^(5/6) × 2^(3/2) ÷ 2^(1/3)',correct:'4',wrong:['2','8','16'],
   explain:'指数法則：aᵖ×aᑫ÷aʳ = aᵖ⁺ᑫ⁻ʳ\n2^(5/6+3/2-1/3) = 2^2 = 4'},
  {text:'8^(1/4) × 8^(1/12) ÷ 8^(1/3)',correct:'1',wrong:['8','1/8','2'],
   explain:'指数法則：aᵖ×aᑫ÷aʳ = aᵖ⁺ᑫ⁻ʳ\n8^(1/4+1/12-1/3) = 8^0 = 1'},
  {text:'³√3² × ⁶√3⁵ ÷ √3',correct:'3',wrong:['9','1','27'],
   explain:'すべて3の指数に直して計算する\n3^(2/3)×3^(5/6)÷3^(1/2) = 3^(2/3+5/6-1/2) = 3^1 = 3'},
  {text:'√8 ÷ ⁶√8⁵ × ³√8⁴',correct:'8',wrong:['2','64','4'],
   explain:'すべて8の指数に直して計算する\n8^(1/2)÷8^(5/6)×8^(4/3) = 8^(1/2-5/6+4/3) = 8^1 = 8'},
];
const usedCombo=new Set();

const RAT_BASES=[2,3,4,5,6];
function genStage4(){
  const kind=pick(['evaluate','express','combo']);
  if(kind==='combo'){
    if(usedCombo.size>=COMBO_RATIONAL.length) usedCombo.clear();
    let item, tries=0;
    do{ item=pick(COMBO_RATIONAL); tries++; } while(usedCombo.has(item.text)&&tries<30);
    usedCombo.add(item.text);
    return {
      stageLabel:'ステージ4：有理数指数（発展）',
      text:item.text+' = ?',
      correct:item.correct, explain:item.explain,
      choices:buildChoices(item.correct,item.wrong)
    };
  } else if(kind==='evaluate'){
    const b=pick(RAT_BASES), q=randInt(2,4), p=pick([-2,-1,1,2,3].filter(x=>x!==0));
    if(p%q===0) return genStage4();
    const a=Math.pow(b,q);
    if(a>2000) return genStage4();
    const text=a+'^('+formatFrac(p,q)+')';
    const correctFrac=powFrac(b,p);
    const correct=fracToStr(correctFrac);
    const explain='指数法則：(bᵠ)^(p/q) = bᵖ　（'+a+' = '+b+sup(q)+'）\n'+text+' = ('+b+sup(q)+')^('+formatFrac(p,q)+') = '+b+'^('+p+') = '+fracStep(b,p)+' = '+correct;
    const candidates=[fracToStr(powFrac(b,p+1)),fracToStr(powFrac(b,p-1)),
                       fracToStr([correctFrac[1],correctFrac[0]]),fracToStr(powFrac(b,q))];
    return {
      stageLabel:'ステージ4：有理数指数',
      text:text+' = ?',
      correct, explain,
      choices:buildChoices(correct,candidates)
    };
  } else {
    const base=pick(RAT_BASES), n=randInt(2,4);
    const mCap=expCapFor(base);
    let m=randInt(1,mCap);
    while(gcd(m,n)!==1) m=randInt(1,mCap);
    const text=ROOT_MARK[n]+base+sup(m);
    const correct=base+'^('+m+'/'+n+')';
    const explain='定義：ⁿ√(aᵐ) = a^(m/n)\n'+text+' = '+base+'^('+m+'/'+n+')';
    const candidates=[base+'^('+n+'/'+m+')', base+'^('+(m+1)+'/'+n+')',
                       base+'^('+m+'/'+(n+1)+')', base+'^(-'+m+'/'+n+')'];
    return {
      stageLabel:'ステージ4：有理数指数',
      text:text+' を aᵐ/ⁿ の形で表すと？',
      correct, explain,
      choices:buildChoices(correct,candidates)
    };
  }
}

const STAGE_GEN=[genStage1,genStage2,genStage3,genStage4];
const STAGE_NAMES=['指数の基本計算','負の指数・0乗','累乗根の計算','有理数指数'];
const STAGE_COLORS=['#7c3aed','#2563eb','#059669','#d97706'];
const TOTAL_QUESTIONS=20;
const QUESTIONS_PER_STAGE=5;
const PASS_SCORE=16;

// Google Apps Script（Webアプリ）の /exec URL。空文字ならローカル保存のみ。
const SAVE_ENDPOINT='https://script.google.com/macros/s/AKfycbxuNmtuJUzZDrzjDQeol4Z-0AZQ7w4wSTyI0JXJ8ictrRVtXtxa6_OCPGOgrMGypOCt/exec';

// ══════════════════════════════════════════════
//  ゲーム状態
// ══════════════════════════════════════════════
let currentUser='';
let score=0, totalQ=0;
let stageCorrect=[0,0,0,0];
let currentQ=null;
let answered=false;

function genQ(){
  const stageIdx=Math.min(3,Math.floor(totalQ/QUESTIONS_PER_STAGE));
  const q=STAGE_GEN[stageIdx]();
  q.stageIdx=stageIdx;
  return q;
}

// ══════════════════════════════════════════════
//  DOM要素
// ══════════════════════════════════════════════
const loginOverlay=document.getElementById('loginOverlay');
const userSelect=document.getElementById('userSelect');
const startBtn=document.getElementById('startBtn');
const appEl=document.getElementById('app');
const resultsEl=document.getElementById('resultsScreen');
const userLabel=document.getElementById('userLabel');
const scoreLabel=document.getElementById('scoreLabel');
const progressDots=document.getElementById('progressDots');
const stageLabelEl=document.getElementById('stageLabel');
const qtextEl=document.getElementById('qtext');
const choicesGrid=document.getElementById('choicesGrid');
const feedbackBox=document.getElementById('feedbackBox');
const explainBox=document.getElementById('explainBox');
const explainText=document.getElementById('explainText');
const nextBtn=document.getElementById('nextBtn');

for(let i=1;i<=40;i++){
  const id='G'+String(i).padStart(2,'0');
  const opt=document.createElement('option');
  opt.value=id; opt.textContent=id;
  userSelect.appendChild(opt);
}
try{
  const savedUser=localStorage.getItem('exponentShooterUser');
  if(savedUser){ userSelect.value=savedUser; startBtn.disabled=false; }
}catch(e){}

userSelect.addEventListener('change',()=>{ startBtn.disabled=!userSelect.value; });
startBtn.addEventListener('click',()=>{
  if(!userSelect.value) return;
  currentUser=userSelect.value;
  try{ localStorage.setItem('exponentShooterUser',currentUser); }catch(e){}
  loginOverlay.style.display='none';
  startGame();
});

function showLogin(){
  resultsEl.style.display='none';
  appEl.hidden=true;
  loginOverlay.style.display='flex';
}

function startGame(){
  score=0; totalQ=0; stageCorrect=[0,0,0,0];
  usedComposite.clear(); usedCombo.clear();
  resultsEl.style.display='none';
  appEl.hidden=false;
  userLabel.textContent='ユーザー: '+currentUser;
  renderQuestion();
}

function renderProgressDots(){
  progressDots.innerHTML='';
  for(let i=0;i<TOTAL_QUESTIONS;i++){
    const d=document.createElement('div');
    d.className='dot'+(i===totalQ?' cur':'');
    if(i<totalQ){ d.style.background=STAGE_COLORS[Math.floor(i/QUESTIONS_PER_STAGE)]; }
    progressDots.appendChild(d);
  }
}

function renderQuestion(){
  answered=false;
  currentQ=genQ();
  scoreLabel.textContent='正解 '+score+' / '+TOTAL_QUESTIONS;
  stageLabelEl.textContent=currentQ.stageLabel;
  qtextEl.textContent=currentQ.text;
  renderProgressDots();

  choicesGrid.innerHTML='';
  currentQ.choices.forEach(choice=>{
    const btn=document.createElement('button');
    btn.className='choiceBtn';
    btn.textContent=choice;
    btn.addEventListener('click',()=>selectAnswer(choice,btn));
    choicesGrid.appendChild(btn);
  });

  feedbackBox.textContent='';
  feedbackBox.className='';
  explainBox.style.display='none';
  nextBtn.style.display='none';
}

function selectAnswer(choice,btnEl){
  if(answered) return;
  answered=true;
  const isCorrect = choice===currentQ.correct;

  Array.from(choicesGrid.children).forEach(btn=>{
    btn.disabled=true;
    if(btn.textContent===currentQ.correct){ btn.classList.add('correct'); }
    else if(btn===btnEl){ btn.classList.add('wrong'); }
    else { btn.classList.add('dim'); }
  });

  if(isCorrect){
    score++;
    stageCorrect[currentQ.stageIdx]++;
    feedbackBox.textContent='✓ 正解！';
    feedbackBox.className='correct';
    explainBox.style.display='none';
  } else {
    feedbackBox.textContent='✗ 不正解';
    feedbackBox.className='wrong';
    explainText.textContent=currentQ.explain;
    explainBox.style.display='block';
  }
  scoreLabel.textContent='正解 '+score+' / '+TOTAL_QUESTIONS;
  nextBtn.style.display='block';
}

nextBtn.addEventListener('click',()=>{
  totalQ++;
  if(totalQ>=TOTAL_QUESTIONS){ goResults(); }
  else { renderQuestion(); }
});

// ══════════════════════════════════════════════
//  結果 → 保存 → 表示
// ══════════════════════════════════════════════
function goResults(){
  appEl.hidden=true;
  const passed=score>=PASS_SCORE;
  const record={
    user:currentUser, score, total:TOTAL_QUESTIONS, passed,
    stageCorrect:[...stageCorrect],
    timestamp:new Date().toISOString()
  };
  saveResult(record);

  const [title,body]=encourageMessage(score);
  const titleEl=document.getElementById('resultsTitle');
  titleEl.textContent=title;
  titleEl.className=passed?'pass':'fail';

  document.getElementById('resultsScoreLine').textContent=currentUser+' さん：'+score+' / '+TOTAL_QUESTIONS+' 問正解';

  const passLineEl=document.getElementById('resultsPassLine');
  passLineEl.textContent=passed?'合格ライン（16問）達成！':'合格ラインまで あと '+(PASS_SCORE-score)+' 問';
  passLineEl.className='passLine '+(passed?'pass':'fail');

  document.getElementById('resultsBody').textContent=body;

  const table=document.getElementById('stageTable');
  table.innerHTML='';
  STAGE_NAMES.forEach((name,i)=>{
    const tr=document.createElement('tr');
    const tdName=document.createElement('td'); tdName.className='name'; tdName.textContent=name;
    const tdVal=document.createElement('td'); tdVal.className='val';
    tdVal.textContent=stageCorrect[i]+' / '+QUESTIONS_PER_STAGE;
    tdVal.style.color = stageCorrect[i]>=4?'#6ee7b7':stageCorrect[i]>=2?'#fbbf24':'#f87171';
    tr.appendChild(tdName); tr.appendChild(tdVal);
    table.appendChild(tr);
  });

  resultsEl.style.display='block';
}

document.getElementById('retryBtn').addEventListener('click',startGame);
document.getElementById('changeUserLink').addEventListener('click',showLogin);

async function saveResult(record){
  try{
    const key='exponentShooterResults';
    const list=JSON.parse(localStorage.getItem(key)||'[]');
    list.push(record);
    localStorage.setItem(key, JSON.stringify(list));
  }catch(e){ console.warn('ローカル保存に失敗:',e); }

  if(SAVE_ENDPOINT){
    try{
      await fetch(SAVE_ENDPOINT, { method:'POST', body: JSON.stringify(record), mode:'no-cors' });
    }catch(e){ console.warn('スプレッドシートへの送信に失敗:',e); }
  }
  console.log('[exponent-shooter] result:', record);
}

function encourageMessage(score){
  if(score===TOTAL_QUESTIONS) return ['🎉 パーフェクト！！','20問すべて正解です。指数法則をマスターしましたね！'];
  if(score>=PASS_SCORE) return ['🎉 合格です！','おめでとうございます。よく頑張りました！'];
  if(score>=12) return ['もう少しで合格！','確実に力がついています。この調子でもう一度挑戦しましょう。'];
  if(score>=8)  return ['着実に前進中！','間違えた問題の解説を読み返して、次はもっと正解できます。'];
  return ['ここからが本番！','指数法則は繰り返すほど身につきます。焦らず、もう一度挑戦しましょう。'];
}
</script>
